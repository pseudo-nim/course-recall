<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Course Recall{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">&#128218; Course Recall</a>
  <div class="nav-right">
    <span class="badge {{ 'ai-on' if ai_enabled else 'ai-off' }}">{{ 'AI mode' if ai_enabled else 'Offline mode' }}</span>
    <a href="{{ url_for('settings_page') }}">Settings</a>
  </div>
</nav>
<main class="container">
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
